name: Get Hot News

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Force notification check"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Shanghai"

    - cron: "30 21 * * *"
      timezone: "Asia/Shanghai"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Verify config
        run: |
          test -f config/config.yaml
          test -f config/frequency_words.txt
          test -f config/timeline.yaml
          test -f config/ai_interests.txt
          echo "Config files OK"

      - name: Run TrendRadar
        env:
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}

          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}

          GITHUB_ACTIONS: true

        run: uv run python -m trendradar

      - name: Upload notification
        if: success()
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          AI_NOTIFY_MIN_SCORE: "0.72"
        run: uv run python scripts/upload_notify.py

      - name: Trigger notification check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_notify == true }}
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          uv run python - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
              region_name=os.environ.get("S3_REGION", "us-east-1"),
              config=Config(
                  signature_version="s3v4",
                  s3={"addressing_style": "path"},
              ),
          )

          s3.put_object(
              Bucket=os.environ["S3_BUCKET_NAME"],
              Key="notify/force.json",
              Body=b'{"force":true}',
              ContentType="application/json",
          )

          print("Watcher force trigger uploaded")
          PY
