# TrendRadar 定制配置
# 目标：最新前沿 / 商业机会 / 极低噪声 / 增量推送

app:
  timezone: Asia/Shanghai
  show_version_update: true
schedule:
  enabled: false
  preset: realtime_incremental
platforms:
  enabled: true
  api_url: ''
  sources:
  - id: wallstreetcn-hot
    name: 华尔街见闻
    expected_domain: wallstreetcn.com
  - id: cls-hot
    name: 财联社热门
    expected_domain: cls.cn
  - id: thepaper
    name: 澎湃新闻
    expected_domain: thepaper.cn
  - id: zhihu
    name: 知乎
    expected_domain: zhihu.com
  - id: toutiao
    name: 今日头条
    expected_domain: toutiao.com
  - id: baidu
    name: 百度热搜
    expected_domain: baidu.com
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
  - id: hacker-news
    name: Hacker News
    url: https://hnrss.org/frontpage
  - id: yahoo-finance
    name: Yahoo Finance
    url: https://finance.yahoo.com/news/rssindex
report:
  mode: incremental
  display_mode: keyword
  sort_by_position_first: true
  rank_threshold: 5
  max_news_per_keyword: 8
filter:
  method: ai
  priority_sort_enabled: true
ai_filter:
  batch_size: 150
  batch_interval: 2
  min_score: 0.72
  reclassify_threshold: 0.72
  prompt_file: prompt.txt
  extract_prompt_file: extract_prompt.txt
  update_tags_prompt_file: update_tags_prompt.txt
display:
  region_order:
  - hotlist
  - rss
  - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 0
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ''
    dingtalk:
      webhook_url: ''
    wework:
      webhook_url: ''
      msg_type: markdown
    telegram:
      bot_token: ''
      chat_id: ''
    email:
      from: ''
      password: ''
      to: ''
      smtp_server: ''
      smtp_port: ''
    ntfy:
      server_url: https://ntfy.sh
      topic: ''
      token: ''
    bark:
      url: ''
    slack:
      webhook_url: ''
    generic_webhook:
      webhook_url: ''
      payload_template: ''
storage:
  backend: auto
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: output
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ''
    bucket_name: ''
    access_key_id: ''
    secret_access_key: ''
    region: ''
  pull:
    enabled: false
    days: 3
ai:
  model: deepseek/deepseek-v4-flash
  api_key: ''
  api_base: ''
  timeout: 120
  temperature: 0.3
  max_tokens: 4000
  num_retries: 1
  fallback_models: []
ai_analysis:
  enabled: true
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  mode: follow_report
  max_news_for_analysis: 80
  include_rss: true
  include_standalone: false
  include_rank_timeline: true
ai_translation:
  enabled: false
  language: 中文
  prompt_file: ai_translation_prompt.txt
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: false
    standalone: false
advanced:
  debug: false
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version
  mcp_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp
  configs_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs
  crawler:
    request_interval: 2000
    use_proxy: false
