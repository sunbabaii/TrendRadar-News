# TrendRadar Final Timeline
# GitHub Actions wakes TrendRadar twice per day at 08:30 and 21:30 Asia/Shanghai.
# This file defines the default behavior for each run.
# upload_notify.py is responsible for the final external notification.

presets:
  realtime_incremental:
    name: "Realtime Incremental"
    description: "Collect current hot lists and RSS, run AI screening, and leave final notification generation to upload_notify.py."

    default:
      collect: true
      analyze: true
      ai_mode: "current"
      push: false
      report_mode: "incremental"
      once:
        analyze: false
        push: false

    periods: {}

    day_plans:
      all_day:
        periods: []

    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"
