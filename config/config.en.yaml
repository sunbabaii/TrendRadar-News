# TrendRadar Final Configuration
# Primary goal:
# - Crawl all currently supported hot-list platforms.
# - Use AI for high-value/frontier/business screening.
# - Use upload_notify.py for the guaranteed cross-platform Top 5.
# - GitHub Actions wakes the job at 08:30 and 21:30 Asia/Shanghai.

app:
  timezone: "Asia/Shanghai"
  show_version_update: false

schedule:
  enabled: false
  preset: "realtime_incremental"

platforms:
  enabled: true
  api_url: ""
  sources:
    - id: "toutiao"
      name: "Toutiao"
      expected_domain: "toutiao.com"
    - id: "baidu"
      name: "Baidu Hot"
      expected_domain: "baidu.com"
    - id: "wallstreetcn-hot"
      name: "WallStreetCN"
      expected_domain: "wallstreetcn.com"
    - id: "thepaper"
      name: "The Paper"
      expected_domain: "thepaper.cn"
    - id: "bilibili-hot-search"
      name: "Bilibili Hot"
      expected_domain: "bilibili.com"
    - id: "cls-hot"
      name: "CLS Hot"
      expected_domain: "cls.cn"
    - id: "ifeng"
      name: "iFeng"
      expected_domain: "ifeng.com"
    - id: "tieba"
      name: "Tieba"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "Weibo"
      expected_domain: "weibo.com"
    - id: "douyin"
      name: "Douyin"
      expected_domain: "douyin.com"
    - id: "zhihu"
      name: "Zhihu"
      expected_domain: "zhihu.com"

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
    - id: "yahoo-finance"
      name: "Yahoo Finance"
      url: "https://finance.yahoo.com/news/rssindex"

report:
  mode: "incremental"
  display_mode: "platform"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

filter:
  method: "ai"
  priority_sort_enabled: true

ai_filter:
  batch_size: 150
  batch_interval: 2
  min_score: 0.52
  reclassify_threshold: 0.52
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

display:
  region_order:
    - hotlist
    - rss
    - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 0

notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 3

ai:
  model: "openai/agnes-2.5-flash"
  api_key: ""
  api_base: ""
  timeout: 120
  temperature: 0.3
  max_tokens: 4000
  num_retries: 1
  fallback_models: []

ai_analysis:
  enabled: true
  language: "English"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 80
  include_rss: true
  include_standalone: false
  include_rank_timeline: true

ai_translation:
  enabled: false
  language: "English"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: false
    standalone: false

advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: ""
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
