# TrendRadar 时间线配置
# 目标：全天采集 + 全天增量推送，不做日报/晚间旧闻汇总
# GitHub Actions 负责定时唤醒；本文件决定每次运行做什么。

presets:

  realtime_incremental:
    name: "实时增量"
    description: "全天采集；仅推送新增高价值新闻；同一事件只有出现实质变化才再次推送。"

    default:
      collect: true
      analyze: true
      ai_mode: "current"
      push: true
      report_mode: "incremental"
      once:
        analyze: false
        push: false

    periods: {}

    day_plans:
      all_day:
        periods: []

    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"
