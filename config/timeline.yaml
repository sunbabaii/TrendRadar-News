# TrendRadar 最终时间线
# GitHub Actions 负责在每天 08:30 / 21:30 唤醒。
# 该文件不再承担定时触发任务，只定义“每次唤醒默认做什么”。
# 外部 upload_notify.py 负责生成跨平台 TOP 5 + AI 高价值通知。

presets:
  realtime_incremental:
    name: "实时增量"
    description: "采集当前热榜与 RSS；使用 AI 识别高价值新增信息。外部通知脚本负责最终通知。"

    default:
      collect: true
      analyze: true
      ai_mode: "current"
      push: false
      report_mode: "incremental"
      once:
        analyze: false
        push: false

    periods: {}

    day_plans:
      all_day:
        periods: []

    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"
